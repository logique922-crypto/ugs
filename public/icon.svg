<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6" />

  <!-- Central Emblem / Hexagonal Warehouse / Smartphone Sync Logo -->
  <g transform="translate(256, 230)">
    <!-- Hexagon Grid Base -->
    <path d="M 0 -130 L 115 -65 L 115 65 L 0 130 L -115 65 L -115 -65 Z" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="12" stroke-linejoin="round" />
    
    <!-- Central Box Isometric Cube -->
    <path d="M 0 -85 L 75 -42 L 0 0 L -75 -42 Z" fill="#818cf8" />
    <path d="M -75 -42 L 0 0 L 0 85 L -75 42 Z" fill="#4f46e5" />
    <path d="M 0 0 L 75 -42 L 75 42 L 0 85 Z" fill="#6366f1" />

    <!-- Isometric Lines -->
    <path d="M 0 0 L 0 85" stroke="#312e81" stroke-width="4" />
    <path d="M 0 0 L -75 -42" stroke="#312e81" stroke-width="4" />
    <path d="M 0 0 L 75 -42" stroke="#312e81" stroke-width="4" />

    <!-- Glowing Signal Dots -->
    <circle cx="0" cy="-130" r="10" fill="#38bdf8" />
    <circle cx="115" cy="-65" r="8" fill="#818cf8" />
    <circle cx="115" cy="65" r="8" fill="#818cf8" />
    <circle cx="-115" cy="-65" r="8" fill="#818cf8" />
    <circle cx="-115" cy="65" r="8" fill="#818cf8" />
    <circle cx="0" cy="130" r="10" fill="#38bdf8" />
  </g>

  <!-- Typography UGS DISTRIBUTION -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="4">
    UGS ERP
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" letter-spacing="3">
    UNIVERS GSM SUD
  </text>
</svg>
